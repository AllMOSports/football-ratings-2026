name: After Week 1 Ratings
 
# Adjust these triggers to fit your season:
# - workflow_dispatch lets you click "Run workflow" manually in the GitHub UI
#   any time (e.g. right after your Week 1 games scraper has finished).
# - The schedule below is commented out by default. Uncomment and set a cron
#   time (UTC) once you know when your Week 1 games file is reliably populated,
#   e.g. Saturday morning after Friday night games have all scraped in.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 12 * * 6"   # 12:00 UTC Saturday = 7:00 AM CDT
 
jobs:
  build-ratings:
    runs-on: ubuntu-latest
 
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      # No third-party packages are required by the script (stdlib only),
      # so no pip install step is needed. If you later add dependencies,
      # add a `pip install -r requirements.txt` step here.
 
      - name: Run After Week 1 Ratings script
        run: python "After Week 1 Ratings.py"
        # If your script or input JSON files live in a subfolder rather than
        # the repo root, add:  working-directory: path/to/folder
 
      - name: Commit and push output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Ratings_After_Week1.json Ratings_After_Week1.csv
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update After Week 1 ratings"
          git push
