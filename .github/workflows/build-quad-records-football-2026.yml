# .github/workflows/build-quad-records-football-2026.yml
#
# Runs build_quad_records_football_2026.py and commits the Quad 1-4 records
# (quad_records_football_2026.json / .csv) back to the repo.
#
# Triggers:
#   - workflow_run: right after "After Week 1 Ratings" finishes successfully.
#     That workflow commits football_ratings_2026.json with the default
#     GITHUB_TOKEN, and bot commits don't fire push triggers, so chaining is
#     how this picks up new ratings automatically.
#   - push: when the ratings file, the games file (committed by the local
#     scraper) or this script changes
#   - repository_dispatch: lets cron-job.org fire it via the GitHub API
#     (event_type: build-quad-records-football)
#   - workflow_dispatch: manual run from the Actions tab
#
# No MSHSAA access, so GitHub runner IP blocking doesn't affect this job.

name: Build Quad Records Football (2026)

on:
  workflow_run:
    workflows: ["After Week 1 Ratings"]
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "football_ratings_2026.json"
      - "football_games_2026_all.json"
      - "build_quad_records_football_2026.py"
  repository_dispatch:
    types: [build-quad-records-football]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-quad-records-football-2026
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip if the upstream ratings run failed.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5   # standard library only, finishes in seconds

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main   # workflow_run would otherwise check out the older triggering commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build quad records
        run: python build_quad_records_football_2026.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quad_records_football_2026.json quad_records_football_2026.csv
          if git diff --cached --quiet; then
            echo "No changes to quad records."
            exit 0
          fi
          git commit -m "Update football quad records ($(TZ=America/Chicago date +'%Y-%m-%d %H:%M CT'))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
          exit 1
