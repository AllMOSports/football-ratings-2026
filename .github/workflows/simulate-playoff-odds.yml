# .github/workflows/simulate-playoff-odds.yml
#
# Runs simulate_playoff_odds.py (district title / Final Four / state final /
# state title odds) and commits playoff_odds_2026.json + .csv back to the repo.
#
# Triggers:
#   - push: when the games CSV, ratings, classification/override inputs, or
#     any of the three scripts change
#   - repository_dispatch: cron-job.org can fire it via the GitHub API
#     (event_type: simulate-playoff-odds), same pattern as the other workflows
#   - workflow_dispatch: manual run from the Actions tab with sims / sigma
#
# Reads only files already in the repo -- never contacts MSHSAA.
 
name: Simulate Playoff Odds
 
on:
  push:
    branches: [main]
    paths:
      - "football_games_2026_all_district_points.csv"
      - "football_ratings_2026.json"
      - "classifications.json"
      - "out_of_state_classifications.json"
      - "out_of_state_records.json"
      - "manual_overrides.json"
      - "simulate_playoff_odds.py"
      - "simulate_district_seeds.py"
      - "build_district_points.py"
  repository_dispatch:
    types: [simulate-playoff-odds]
  workflow_dispatch:
    inputs:
      sims:
        description: "Number of simulations"
        required: false
        default: "10000"
      sigma:
        description: "Margin standard deviation (points)"
        required: false
        default: "16"
 
permissions:
  contents: write
 
concurrency:
  group: simulate-playoff-odds
  cancel-in-progress: true
 
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
 
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install numpy
 
      - name: Validate scoring against build_district_points
        run: python simulate_district_seeds.py --validate
 
      - name: Run playoff simulation
        env:
          SIMS: ${{ github.event.inputs.sims || '10000' }}
          SIGMA: ${{ github.event.inputs.sigma || '16' }}
        run: python simulate_playoff_odds.py --sims "$SIMS" --sigma "$SIGMA"
 
      - name: Commit playoff odds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playoff_odds_2026.json playoff_odds_2026.csv
          if git diff --cached --quiet; then
            echo "No changes to playoff odds."
            exit 0
          fi
          git commit -m "Update playoff odds ($(TZ=America/Chicago date +'%Y-%m-%d %H:%M CT'))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
          exit 1
