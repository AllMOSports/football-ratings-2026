# .github/workflows/simulate-district-seeds.yml
#
# Runs simulate_district_seeds.py and commits the projections back to the repo.
#
# Triggers:
#   - push: whenever the games CSV, ratings JSON, or classification/override
#     inputs change (i.e. right after the nightly scrape/ratings update lands)
#   - repository_dispatch: lets cron-job.org fire it on a fixed schedule via
#     the GitHub API (event_type: simulate-district-seeds), same pattern as
#     the other nightly workflows
#   - workflow_dispatch: manual run from the Actions tab, with optional
#     sims / sigma overrides
#
# This job only reads files already in the repo -- it never contacts MSHSAA,
# so the GitHub runner IP blocking doesn't affect it.
 
name: Simulate District Seeds
 
on:
  push:
    branches: [main]
    paths:
      - "football_games_2026_all_district_points.csv"
      - "football_ratings_2026.json"
      - "classifications.json"
      - "out_of_state_classifications.json"
      - "out_of_state_records.json"
      - "manual_overrides.json"
      - "simulate_district_seeds.py"
      - "build_district_points.py"
  repository_dispatch:
    types: [simulate-district-seeds]
  workflow_dispatch:
    inputs:
      sims:
        description: "Number of simulations"
        required: false
        default: "10000"
      sigma:
        description: "Margin standard deviation (points)"
        required: false
        default: "15"
 
permissions:
  contents: write
 
concurrency:
  group: simulate-district-seeds
  cancel-in-progress: true
 
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
 
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install numpy
 
      - name: Validate scoring against build_district_points
        run: python simulate_district_seeds.py --validate
 
      - name: Run simulation
        env:
          SIMS: ${{ github.event.inputs.sims || '10000' }}
          SIGMA: ${{ github.event.inputs.sigma || '15' }}
        run: python simulate_district_seeds.py --sims "$SIMS" --sigma "$SIGMA"
 
      - name: Commit projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add district_seed_projections_2026.json district_seed_projections_2026.csv
          if git diff --cached --quiet; then
            echo "No changes to projections."
            exit 0
          fi
          git commit -m "Update district seed projections ($(TZ=America/Chicago date +'%Y-%m-%d %H:%M CT'))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
          exit 1
