name: Playoff Bracket Optimizer - Football
 
on:
  workflow_dispatch:
    inputs:
      classes:
        description: "Classes to build (comma-separated)"
        default: "1,2,3,4,5,6"
        required: true
      priority:
        description: "What to optimize after travel limits"
        type: choice
        options: [balance, travel, geographic]
        default: balance
      bye_rule:
        description: "district = each district's top seeds get its byes; statewide = top seeds statewide"
        type: choice
        options: [district, statewide]
        default: district
      reseed:
        description: "Re-seed district champions by seed after districts (state rounds ignore geography)"
        type: boolean
        default: false
      h2h_jumps:
        description: "Apply the head-to-head jump rule to seeds"
        type: boolean
        default: true
      district_limit:
        description: "Max drive (hours) between any two teams in a district"
        default: "3.0"
        required: true
      next_limit:
        description: "Max drive (hours) between teams in districts that meet in the Quarterfinal"
        default: "4.0"
        required: true
      travel_slack_pct:
        description: "% extra over-limit travel allowed to improve balance (classes with zero violations stay at zero)"
        default: "50"
        required: true
      time_limit:
        description: "Solver seconds per class (per limit if sweeping)"
        default: "300"
        required: true
      extra_args:
        description: "Optional extra options, e.g. --sweep 2.5,3,3.5,4  --factor 0.85  --calibration calibration.csv --factor auto"
        default: ""
        required: false
 
permissions:
  contents: write
 
concurrency:
  group: playoff-bracket-optimizer
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: pip install ortools requests
 
      - name: Build brackets
        run: >
          python playoff_bracket_optimizer.py
          --sport football
          --classes "${{ inputs.classes }}"
          --priority "${{ inputs.priority }}"
          --bye-rule "${{ inputs.bye_rule }}"
          --district-limit "${{ inputs.district_limit }}"
          --next-limit "${{ inputs.next_limit }}"
          --travel-slack-pct "${{ inputs.travel_slack_pct }}"
          --time-limit "${{ inputs.time_limit }}"
          ${{ inputs.reseed && '--reseed' || '' }}
          ${{ inputs.h2h_jumps == false && '--no-jumps' || '' }}
          ${{ inputs.extra_args }}
 
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add school_coords.json drive_times playoff_brackets
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update football travel-limited playoff brackets [automated]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
