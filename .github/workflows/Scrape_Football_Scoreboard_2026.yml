name: Scrape MSHSAA Football Scoreboard
 
on:
  # Manual trigger from the Actions tab
  workflow_dispatch:
 
  # Auto-run every Thu/Fri/Sat night during the 2026 season (Aug-Dec),
  # after games are likely final. Times are UTC.
  # Odd/off-peak minute (17) to avoid GitHub's top-of-hour scheduler congestion.
  # 17 05 * * 4,5,6 = 11:17 PM CDT Thu/Fri, 11:17 PM CST Sat (adjust if DST matters to you)
  schedule:
    - cron: '17 5 * 8,9,10,11,12 4,5,6'
 
permissions:
  contents: write
 
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
 
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium
 
      - name: Run scraper
        run: python scrape_football_scoreboard_2026.py --season 2026 --out football_scoreboard_2026.json
 
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add football_scoreboard_2026.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update football scoreboard data [automated]"
          git push
