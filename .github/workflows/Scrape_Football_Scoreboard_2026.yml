name: Scrape MSHSAA Football Games (2026)
 
on:
  # Manual trigger from the Actions tab
  workflow_dispatch:
 
  # Auto-run every Thu/Fri/Sat night during the 2026 season (Aug-Dec).
  # Times are UTC. Odd/off-peak minute (17) to avoid GitHub's top-of-hour
  # scheduler congestion.
  schedule:
    - cron: '17 5 * 8,9,10,11,12 4,5,6'
 
permissions:
  contents: write
 
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # this script typically finishes in 2-5 min; 15 gives headroom without risking a runaway job
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas
 
      - name: Debug - list repo contents
        run: |
          pwd
          ls -la
 
      - name: Run scraper
        run: python scrape_football_games_2026.py
 
      # Rebuilds football_schedule_2026.json (the per-team keyed format
      # the Sport Detail snippet's SCHEDULE_URLS reads) from whatever
      # scrape_football_games_2026.py just wrote to
      # football_games_2026_all.json. Runs every time this job runs --
      # cheap, and keeps the two files from ever drifting out of sync.
      # See build_football_schedule_2026.py's own docstring for what it
      # does and doesn't populate (no predicted scores/deltas until
      # football_ratings_2026.json exists after Week 3).
      - name: Rebuild per-team schedule file
        run: python build_football_schedule_2026.py football_games_2026_all.json football_schedule_2026.json
 
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add football_games_2026.json football_games_2026.csv football_games_2026_all.json football_games_2026_all.csv football_schedule_2026.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update 2026 football games [automated]"
          git push
